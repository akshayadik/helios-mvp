# pyproject.toml — HELIOS MVP
#
# Merge audit (your file → this file)
# ─────────────────────────────────────────────────────────────────────────────
# PRESERVED as-is:
#   name, version (0.1.0), description, authors, readme, license, packages
#   dev deps: ruff, mypy, pytest, pytest-cov, pre-commit
#   [tool.mypy] ignore_missing_imports, python_version
#   [tool.ruff] target-version
#   [tool.ruff.lint] existing rules E F W I B UP
#   [build-system]
#
# CHANGED (with reason):
#   python "^3.11"           → ">=3.11,<3.12"
#     Reason: ^3.11 allows Python 3.12+. pyarrow and vLLM (Stage 2) are
#     not yet validated on 3.12 in the binding hardware config (§B.1).
#     Upper bound is a reproducibility commitment, not a preference.
#
#   pydantic "^2.0"          → ">=2.9,<2.10"
#     Reason: ^2.0 permits any 2.x release. pydantic changes float
#     serialisation between minor versions, which would silently break
#     snapshot hash determinism (§6.2). Patch ceiling locks the resolver
#     to a single minor series; poetry.lock records the exact version.
#     Deviation-log entry required for any change to the resolved version.
#
#   ruff line-length 100     → 88
#     Reason: black (the format authority) defaults to 88. Using 100 in
#     ruff with 88 in black creates disagreements where ruff passes a line
#     that black then reformats. Both tools must agree on the same limit.
#
#   ruff rules               → added N, C4, SIM, TCH, RUF
#     Reason: N (naming), C4 (comprehensions), SIM (simplify), TCH
#     (TYPE_CHECKING guards), RUF (ruff-native) are low-noise, high-value
#     additions that catch real bugs in research code. No existing rule
#     removed.
#
#   pytest addopts "-q"      → full coverage flag set
#     Reason: -q suppresses coverage output entirely. The Stage 0 exit gate
#     requires coverage ≥ 90% (EG1 through EG6 depend on test integrity).
#     --cov-fail-under=90 enforces the gate; reducing it requires a
#     deviation-log entry.
#
#   mypy                     → strict=true + pydantic plugin + overrides
#     Reason: ignore_missing_imports alone is not strict type-checking.
#     The pydantic mypy plugin is required for model-field types to
#     resolve correctly. pyarrow/duckdb overrides silence known stub gaps.
#
# ADDED (not in your file):
#   runtime: pyarrow, duckdb
#     Reason: required by Day 4 (Parquet capture) and Day 3 (result store)
#     respectively. Tier 1 packages with patch-ceiling ranges.
#
#   dev: black, isort, coverage[toml]
#     Reason: black is the format authority referenced in ruff config;
#     isort for editor integration; coverage[toml] enables [tool.coverage]
#     config in this file.
#
#   [tool.coverage.run], [tool.coverage.report]
#     Reason: without these, coverage reports are non-reproducible (no
#     branch coverage, no consistent exclusion patterns).
#
#   [tool.ruff.format], [tool.ruff.lint.per-file-ignores]
#     Reason: ruff format needs explicit config to match black; test files
#     need assert/annotation exemptions.
#
#   [tool.isort], [tool.black]
#     Reason: editor integrations. ruff handles CI; these keep VS Code /
#     PyCharm formatters consistent with CI output.
#
#   pytest: pythonpath, markers, filterwarnings
#     Reason: pythonpath=["."] makes `import helios` work without editable
#     install; markers prevents unknown-marker warnings; filterwarnings
#     turns warnings into errors (with a pyarrow carve-out).
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.poetry]
name        = "helios-mvp"
version     = "0.1.0"
description = "HELIOS MVP — Research-grade RCA framework with C1 runtime invariants"
authors     = ["Akshay Adik"]
readme      = "README.md"
license     = "MIT"
packages    = [{ include = "helios" }]
 
# ─────────────────────────────────────────────────────────────────────────────
# Runtime dependencies
# ─────────────────────────────────────────────────────────────────────────────
#
# Pinning tiers (see full rationale in merge audit above):
#
#   TIER 1 — narrow patch-ceiling range in pyproject.toml;
#            exact version locked in poetry.lock (generated by `poetry install`).
#            Any change to the version in poetry.lock = deviation-log entry.
#            Packages: pydantic, pyarrow, duckdb.
#
#   TIER 2 — minor-floor + major-ceiling range.
#            Lock-file updates to these do NOT require a deviation entry
#            unless a test fails as a result.
#            Packages: all dev deps.
 
[tool.poetry.dependencies]
python   = ">=3.11,<3.12"   # CHANGED: strict upper bound (was ^3.11)
 
# TIER 1 — patch-ceiling range; exact version in poetry.lock.
# Target lock versions (confirmed after `poetry install` on Day 1):
#   pydantic 2.9.2 | pyarrow 18.1.0 | duckdb 1.1.3
pydantic = ">=2.9,<2.10"    # CHANGED from ^2.0; schema determinism (§6.2)
pyarrow  = ">=18.0,<19.0"   # ADDED; Parquet capture (Day 4, §3.7)
duckdb   = ">=1.1,<1.2"     # ADDED; result store (Day 3, store/schema.sql)
 
# ─────────────────────────────────────────────────────────────────────────────
# Development / CI dependencies (TIER 2)
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.poetry.group.dev.dependencies]
# PRESERVED — versions tightened to match actual current releases
ruff       = ">=0.6,<1.0"    # PRESERVED range; <1.0 guards against pre→1.0 breaks
mypy       = ">=1.11,<3.0"   # PRESERVED floor; ceiling added
pytest     = ">=8.3,<10.0"   # PRESERVED floor; ceiling added
pytest-cov = ">=5.0,<8.0"    # PRESERVED floor; ceiling added
pre-commit = ">=3.8,<5.0"    # PRESERVED floor; ceiling added
 
# ADDED
black      = ">=24.0,<27.0"  # format authority; editor integration
isort      = ">=5.12,<6.0"   # import sorter; editor integration
coverage   = { version = ">=7.4,<8.0", extras = ["toml"] }
                              # [toml] extra enables [tool.coverage] config here
 
# ─────────────────────────────────────────────────────────────────────────────
# Build system
# ─────────────────────────────────────────────────────────────────────────────
 
[build-system]
requires      = ["poetry-core>=1.0.0"]   # PRESERVED exactly
build-backend = "poetry.core.masonry.api"
 
# =============================================================================
# Tool configuration
# =============================================================================
 
# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.pytest.ini_options]
testpaths  = ["tests"]        # PRESERVED
pythonpath = ["."]            # ADDED: makes `import helios` work without install
 
# CHANGED: was just "-q". Coverage flags added for Stage 0 exit gate (EG1-EG6).
# --cov-fail-under=90 is the binding gate. Reducing it requires a deviation entry.
addopts = [
    "-q",                             # PRESERVED: keep quiet output
    "--tb=short",                     # ADDED: concise tracebacks
    "--strict-markers",               # ADDED: unknown markers fail the run
    "--cov=helios/",                  # ADDED: measure helios/ package (path avoids import-time lookup)
    "--cov=scripts/",                 # ADDED: measure scripts/ (path avoids import-time lookup)
    "--cov-branch",                   # ADDED: branch coverage (sets COV_CORE_BRANCH for subprocesses)
    "--cov-report=term-missing",      # ADDED: show uncovered lines in terminal
    "--cov-report=xml:coverage.xml",  # ADDED: machine-readable for CI upload
    "--cov-fail-under=90",            # ADDED: Stage 0 binding gate
]
 
# ADDED: declare markers so --strict-markers doesn't fail on unknown ones
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring Docker or external services",
]
 
# ADDED: treat warnings as errors; carve out known noisy third-party warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyarrow",
    "ignore::coverage.exceptions.CoverageWarning",  # carve-out: coverage source-not-found warnings must not abort collection
]
 
# ─────────────────────────────────────────────────────────────────────────────
# coverage  (ADDED — section did not exist)
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.coverage.run]
source         = ["helios/", "scripts/"]
branch         = true           # branch coverage catches partial conditionals
relative_files = true           # normalise all paths so subprocess measurements
                                # (/tmp/.../scripts/foo.py) merge with the main
                                # process measurements (scripts/foo.py)
 
[tool.coverage.report]
# Add legitimate dead-code patterns here rather than # pragma: no cover inline
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",             # bare Ellipsis in stub bodies
]
show_missing = true
skip_empty   = true
 
# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.mypy]
python_version         = "3.11"          # PRESERVED
ignore_missing_imports = true            # PRESERVED as global fallback
# ADDED: strict mode + pydantic plugin
strict                 = true
plugins                = ["pydantic.mypy"]
 
# PRESERVED: your files list, extended to include scripts/
# (bin/ preserved in case you add CLI entry points there later)
files = ["helios", "bin", "scripts", "tests"]
 
# ADDED: per-module overrides for packages with incomplete stubs
[[tool.mypy.overrides]]
module         = ["pyarrow.*"]
ignore_missing_imports = true
ignore_errors  = true          # pyarrow stubs are too incomplete for strict
 
[[tool.mypy.overrides]]
module         = ["duckdb.*"]
ignore_missing_imports = true  # duckdb stubs exist but are partial

[[tool.mypy.overrides]]
module                    = ["tests.*"]
disallow_untyped_defs     = false
disallow_untyped_calls    = false
disallow_incomplete_defs  = false
disallow_any_generics     = false

# ─────────────────────────────────────────────────────────────────────────────
# ruff
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.ruff]
target-version = "py311"   # PRESERVED
line-length    = 88        # CHANGED from 100 → 88 to match black (see audit)
 
[tool.ruff.lint]
preview = true   # enables stable-preview rules (e.g. RUF022) so local == CI
# PRESERVED rules: E, F, W, I, B, UP
# ADDED rules:     N (naming), C4 (comprehensions), SIM (simplify),
#                  TCH (TYPE_CHECKING guards), RUF (ruff-native)
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "TCH", "RUF"]
ignore = [
    "E501",  # line-too-long — handled by ruff format / black
    "B008",  # function call in default args — pydantic Field() uses this
]
 
# ADDED: test files don't need annotations or docstrings; assert is fine
[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S101", "ANN", "D"]
"scripts/*" = ["ANN"]     # scripts use stdlib only; full annotations optional
 
# ADDED: explicit format config so ruff format and black agree
[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
 
# ─────────────────────────────────────────────────────────────────────────────
# isort  (ADDED — editor integration; ruff I rule handles CI)
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.isort]
profile           = "black"
line_length       = 88
known_first_party = ["helios"]
 
# ─────────────────────────────────────────────────────────────────────────────
# black  (ADDED — editor integration; ruff format handles CI)
# ─────────────────────────────────────────────────────────────────────────────
 
[tool.black]
target-version = ["py311"]
line-length    = 88
 