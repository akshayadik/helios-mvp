# Approval console (S4.2, design K-a, K-h): static files plus a same-origin
# proxy for the API. Only the console's own files, /v1/ and /health are
# served; everything else is a 404.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|app\.js|api\.js|model\.js|timing\.js|console\.css)$ {
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    location / {
        return 404;
    }
}
