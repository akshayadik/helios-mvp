# gitleaks configuration for HELIOS MVP
#
# [extend] useDefault is required: a custom config without it REPLACES the
# built-in rule set, leaving zero rules (scanning silently finds nothing).
[extend]
useDefault = true

# Allowlist known false positives in poetry.lock (sha256 hashes match token patterns)
[allowlist]
description = "False positive sha256 hashes in poetry.lock"
paths = ["poetry.lock"]
