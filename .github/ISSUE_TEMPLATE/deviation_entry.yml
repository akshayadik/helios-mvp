name: Deviation Entry (C1)
description: Log a protocol deviation with analytic consequence (§6.5).
title: "[Deviation] "
labels: ["c1-deviation"]
body:
  - type: input
    id: stage
    attributes:
      label: Stage
      placeholder: "Stage 2"
    validations:
      required: true
  - type: input
    id: clause
    attributes:
      label: Clause / section reference
      placeholder: "§3.6.6 / Execution Plan §6.4"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: Concrete description of what changed.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Analytic consequence
      description: 'Typically: "hypothesis X moves from confirmatory to exploratory".'
    validations:
      required: true
  - type: checkboxes
    id: cli
    attributes:
      label: Confirmation
      options:
        - label: I will run `bin/log_deviation.py` with these fields BEFORE merging the related PR.
          required: true
