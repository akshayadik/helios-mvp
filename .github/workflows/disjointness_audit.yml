name: Disjointness Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install
      - name: Static disjointness audit
        run: poetry run python -m helios.vcl.disjointness

      - name: Dynamic disjointness audit (coverage.py contexts)
        run: |
          poetry run coverage run --context=HELIOS-Full -m pytest tests/ -q
          poetry run coverage run --append --context=HELIOS-noGraph -m pytest tests/ -q
          poetry run coverage report --contexts="HELIOS-Full|HELIOS-noGraph" --include="helios/pipelines/*"
